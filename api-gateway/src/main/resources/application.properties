spring.application.name=api-gateway
server.port=8080

gateway.order-service.uri=http://localhost:8081

# Rate-limit backing store: embedded (in-process) Redis by default - no Docker/Redis install
# required to run this project (see RateLimitBackendConfig). Set embedded=false to instead
# connect to a real external Redis at host/port.
gateway.redis.embedded=true
gateway.redis.host=localhost
gateway.redis.port=6379

# Both limits within a tier apply at once, per client (X-User-Id header, else IP).
# Loose: browsing/reading orders.
gateway.rate-limit.browse.per-minute.capacity=60
gateway.rate-limit.browse.per-day.capacity=2000

# Strict: placing an order (checkout-equivalent).
gateway.rate-limit.checkout.per-minute.capacity=5
gateway.rate-limit.checkout.per-day.capacity=20
